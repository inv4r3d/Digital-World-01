<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Digital Art: Vertical Depth</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; margin: auto; }
    </style>
</head>
<body>
<script>
let digits = [];
let duration = 180; // 3 минуты
let startTime;
const FPS = 60;

function setup() {
    // Рассчитываем 16:9
    let w = windowWidth;
    let h = (windowWidth * 9) / 16;
    if (h > windowHeight) {
        h = windowHeight;
        w = (windowHeight * 16) / 9;
    }
    createCanvas(w, h);
    textFont('Courier New');
    textAlign(CENTER, CENTER);
    startTime = millis();
}

function draw() {
    let elapsed = (millis() - startTime) / 1000;
    let progress = elapsed / duration; // 0.0 -> 1.0

    if (progress >= 1.0) {
        digits = [];
        startTime = millis();
        return;
    }

    // ТАЮЩИЙ СЛЕД:
    // Регулируем прозрачность слоя для эффекта троссирующего следа
    // Чем ближе к финалу, тем плотнее становится экран
    let tailOpacity = map(progress, 0, 1, 45, 15);
    background(0, 8, 20, tailOpacity);

    // КОЛИЧЕСТВО:
    // Экспоненциальный рост числа цифр
    let spawnRate = map(pow(progress, 2.5), 0, 1, 0.5, 40);
    for (let i = 0; i < spawnRate; i++) {
        digits.push(new Digit(progress));
    }

    // ДРОЖАНИЕ ЭКРАНА:
    // Начинается после 60% времени, усиливается к концу
    if (progress > 0.6) {
        let shake = map(progress, 0.6, 1, 0, 12);
        translate(random(-shake, shake), random(-shake, shake));
    }

    // ОБРАБОТКА ЦИФР:
    // Сортируем по Z, чтобы дальние были за ближними (параллакс)
    digits.sort((a, b) => a.z - b.z);

    for (let i = digits.length - 1; i >= 0; i--) {
        digits[i].update(progress);
        digits[i].display(progress);
        
        if (digits[i].y < -100) {
            digits.splice(i, 1);
        }
    }
}

class Digit {
    constructor(p) {
        // Глубина: 0.1 (далеко) до 1.0 (близко)
        this.z = random(0.1, 1.0);
        
        this.x = random(width);
        this.y = height + 50;
        this.char = random() > 0.5 ? "1" : "0";
        
        // Прямолинейная скорость зависит от глубины
        this.speed = map(this.z, 0.1, 1.0, 1, 12);
        
        // Размер зависит от глубины
        this.baseSize = map(this.z, 0.1, 1.0, 8, 42);
        
        // Яркость: дальние темнее, ближние ярче
        this.brightness = map(this.z, 0.1, 1.0, 50, 255);
    }

    update(p) {
        // Движение строго вверх
        this.y -= this.speed;

        // Легкое дрожание самих цифр (индивидуальное) в конце
        if (p > 0.7) {
            let jitter = map(p, 0.7, 1, 0, 3);
            this.x += random(-jitter, jitter);
        }
        
        // Эффект заполнения (катарсис): в конце цифры могут начать замедляться 
        // или наслаиваться друг на друга, заполняя 70% экрана
        if (p > 0.9) {
            this.speed *= 0.99; // эффект вязкости в конце
        }
    }

    display(p) {
        let pColor = map(p, 0, 1, 0, 100); // прогресс цвета
        
        // Цветовая палитра: Холодный синий -> Глубокий голубой
        // Добавляем немного вариативности в яркость
        let varBright = this.brightness * random(0.8, 1.2);
        
        // Отрисовка свечения для ближних цифр
        if (this.z > 0.8) {
            drawingContext.shadowBlur = map(p, 0, 1, 2, 15);
            drawingContext.shadowColor = `rgba(0, 180, 255, 0.6)`;
        }

        fill(0, varBright * 0.8, varBright, varBright);
        textSize(this.baseSize);
        text(this.char, this.x, this.y);
        
        drawingContext.shadowBlur = 0;
    }
}

function windowResized() {
    let w = windowWidth;
    let h = (windowWidth * 9) / 16;
    resizeCanvas(w, h);
}
</script>
</body>
</html>
