<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Digital Art: Vertical Depth (Optimized)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { 
            display: block; 
            margin: auto;
        }
    </style>
</head>
<body>
<script>
let digits = [];
let duration = 180; // 3 минуты
let startTime;
const MAX_DIGITS = 2500; // Ограничиваем максимальное количество

// Оптимизация: предварительно рассчитанные значения
let lastSpawnTime = 0;
let needsSort = false; // Флаг для сортировки
let lastProgress = 0;

function setup() {
    let w = windowWidth;
    let h = (windowWidth * 9) / 16;
    if (h > windowHeight) {
        h = windowHeight;
        w = (windowHeight * 16) / 9;
    }
    let canvas = createCanvas(w, h);
    
    // Используем моноширинный шрифт
    textFont('monospace');
    textAlign(CENTER, CENTER);
    
    startTime = millis();
    lastSpawnTime = millis();
}

function draw() {
    let elapsed = (millis() - startTime) / 1000;
    let progress = elapsed / duration;

    // Сброс анимации
    if (progress >= 1.0) {
        digits = [];
        startTime = millis();
        lastSpawnTime = millis();
        needsSort = false;
        lastProgress = 0;
        clear();
        return;
    }

    // 1. ОПТИМИЗИРОВАННЫЙ СЛЕД
    // Используем полупрозрачный черный прямоугольник для эффекта следа
    fill(0, 0, 0, 20);
    noStroke();
    rect(0, 0, width, height);

    // 2. ОПТИМИЗИРОВАННОЕ СОЗДАНИЕ ЦИФР
    let currentTime = millis();
    if (currentTime - lastSpawnTime > 16 && digits.length < MAX_DIGITS) { // ~60 FPS
        lastSpawnTime = currentTime;
        
        // Используем кубическую функцию для более плавного роста
        let spawnRate = map(pow(progress, 2), 0, 1, 0.5, 30);
        
        // Ограничиваем количество создаваемых цифр за кадр
        let spawnCount = min(floor(spawnRate), 8);
        
        for (let i = 0; i < spawnCount; i++) {
            digits.push(new Digit(progress));
        }
        needsSort = true;
    }

    // 3. ОПТИМИЗИРОВАННАЯ СОРТИРОВКА
    // Сортируем только когда нужно и не каждый кадр
    if (needsSort && digits.length > 100 && frameCount % 10 === 0) {
        digits.sort((a, b) => a.z - b.z);
        needsSort = false;
    }

    // 4. ДРОЖАНИЕ ЭКРАНА (обработка отдельно)
    let shakeX = 0, shakeY = 0;
    if (progress > 0.6) {
        let shake = map(progress, 0.6, 1, 0, 8);
        shakeX = random(-shake, shake);
        shakeY = random(-shake, shake);
    }

    // 5. ОПТИМИЗИРОВАННАЯ ОТРИСОВКА
    push();
    translate(shakeX, shakeY);
    
    // Рисуем цифры с конца для правильного перекрытия
    for (let i = digits.length - 1; i >= 0; i--) {
        let digit = digits[i];
        
        // Удаляем если вышли за пределы или исчезли
        if (digit.y < -100 || digit.brightness <= 10) {
            digits.splice(i, 1);
            continue;
        }
        
        digit.update(progress);
        digit.display();
    }
    
    pop();
    
    lastProgress = progress;
}

class Digit {
    constructor(p) {
        this.z = random(0.1, 1.0);
        this.x = random(width);
        this.y = height + random(50, 150); // Разный старт
        this.char = random() > 0.5 ? "1" : "0";
        this.speed = map(this.z, 0.1, 1.0, 1.0, 10.0);
        this.baseSize = map(this.z, 0.1, 1.0, 10, 36);
        this.brightness = map(this.z, 0.1, 1.0, 60, 255);
        
        // Кэшируем цвет
        this.colorR = 0;
        this.colorG = this.brightness * 0.7;
        this.colorB = this.brightness;
        
        // Флаг для свечения
        this.hasGlow = this.z > 0.7;
        
        // Случайное смещение для дрожания
        this.jitterX = 0;
        this.jitterY = 0;
    }

    update(p) {
        // Движение вверх
        this.y -= this.speed;
        
        // Дрожание в конце
        if (p > 0.7) {
            let jitterAmount = map(p, 0.7, 1, 0, 2.5);
            this.jitterX = random(-jitterAmount, jitterAmount);
            this.jitterY = random(-jitterAmount, jitterAmount);
        }
        
        // Замедление в самом конце
        if (p > 0.92) {
            this.speed *= 0.995;
            // Постепенное исчезновение
            this.brightness *= 0.99;
            this.colorG = this.brightness * 0.7;
            this.colorB = this.brightness;
        }
    }

    display() {
        // Эффект свечения для ближних цифр
        if (this.hasGlow && this.brightness > 100) {
            fill(100, 180, 255, this.brightness * 0.3);
            textSize(this.baseSize * 1.1);
            text(this.char, this.x + this.jitterX, this.y + this.jitterY);
        }
        
        // Основная цифра
        fill(this.colorR, this.colorG, this.colorB, this.brightness);
        textSize(this.baseSize);
        text(this.char, this.x + this.jitterX, this.y + this.jitterY);
    }
}

function windowResized() {
    let w = windowWidth;
    let h = (windowWidth * 9) / 16;
    if (h > windowHeight) {
        h = windowHeight;
        w = (windowHeight * 16) / 9;
    }
    resizeCanvas(w, h);
}

// Дебаг информация
function keyPressed() {
    if (key === 'd' || key === 'D') {
        console.log('Digits:', digits.length, 'FPS:', frameRate().toFixed(1));
    }
    if (key === ' ') {
        // Перезапуск анимации
        digits = [];
        startTime = millis();
        lastSpawnTime = millis();
    }
}
</script>
</body>
</html>
